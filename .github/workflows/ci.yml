
      - name: Check Docker Hub username secret
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Docker Hub username secret is missing"
            exit 1
          fi
          echo "Docker Hub username secret is configured"

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker build -t "$DOCKERHUB_USERNAME/devops-capstone:v1" .


